name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk jp-card-scanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jp-card-scanner-apk
          path: jp-card-scanner.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${{ github.run_number }}" jp-card-scanner.apk \
            --target "${{ github.sha }}" \
            --title "JP Card Scanner for Android (build ${{ github.run_number }})" \
            --notes "Install: download jp-card-scanner.apk on your Android phone, open it, and allow installing from your browser if asked. Built from ${{ github.sha }} on ${{ github.ref_name }}." \
            --latest
