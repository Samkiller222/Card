<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d93a3a">
  <link rel="manifest" href="manifest.webmanifest">
  <title>JP Card Scanner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>JP Card Scanner</h1>
    <p class="sub">Scan a Japanese Pokémon card to look up its price</p>
  </header>

  <main>
    <section class="scan">
      <label class="scan-button" for="camera">
        <span>📷 Scan a card</span>
      </label>
      <input id="camera" type="file" accept="image/*" capture="environment" hidden>
      <label class="link-button" for="gallery">or pick a photo</label>
      <input id="gallery" type="file" accept="image/*" hidden>
      <p class="tip">Lay the card flat in good light, fill the frame, and make sure the set code and number at the bottom are sharp.</p>
    </section>

    <section id="status" class="status" hidden>
      <img id="preview" alt="Your photo">
      <div>
        <div class="spinner" aria-hidden="true"></div>
        <p id="status-text">Reading the card…</p>
      </div>
    </section>

    <section id="error" class="error" hidden></section>

    <section id="result" class="result" hidden></section>

    <section class="history">
      <div class="history-head">
        <h2>Recent scans</h2>
        <button id="clear-history" class="link-button" type="button">Clear</button>
      </div>
      <ul id="history-list"></ul>
      <p id="history-empty" class="muted">Cards you scan will show up here.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
